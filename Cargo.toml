[package]
name = "poler-mesh"
version = "0.2.0"
edition = "2021"
description = "POLER Mesh hub — единый MCP-диспетчер: один токен агента → вся экосистема (git, блокноты, поиск)"
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# --- poler-wire v1 (собственный транспорт, v0.2.0): только чистые криптопримитивы ---
ed25519-dalek = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.22"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
