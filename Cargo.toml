[package]
name = "poler-mesh"
version = "0.1.0"
edition = "2021"
description = "POLER Mesh hub — единый MCP-диспетчер: один токен агента → вся экосистема (git, блокноты, поиск)"
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
